name: Enviar Alertas Telegram

on:
  workflow_dispatch:     # Permite rodar manualmente no botão do GitHub
  repository_dispatch:    # Permite o disparo vindo do cron-job.org

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar alertas do Telegram
        run: python enviar_alertas.py