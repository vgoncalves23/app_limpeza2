name: Enviar Alertas Telegram

on:
  schedule:
    - cron: '55 21 * * *'  # Roda às 21:55 UTC (18:55 Horário de Brasília)
  workflow_dispatch:

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar alertas do Telegram
        run: python enviar_alertas.py