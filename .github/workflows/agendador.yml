name: Enviar Alertas Telegram

on:
  schedule:
    - cron: '0 11 * * *'  # Roda todos os dias às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 17 * * *'  # Roda todos os dias às 17:00 UTC (14:00 Horário de Brasília)
    - cron: '0 21 * * *'  # Exemplo opcional: Roda às 18:00 Horário de Brasília
  workflow_dispatch:      # Permite que você clique em "Run workflow" manualmente quando quiser

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar alertas do Telegram
        run: python enviar_alertas.py